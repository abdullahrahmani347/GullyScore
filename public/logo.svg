<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- GullyScore Logo Mark — static SVG version for PWA manifest / favicon use -->
  <!-- Matches the React <LogoMark /> component in src/components/brand/Logo.tsx -->
  <rect width="32" height="32" rx="7" fill="#050810"/>
  <!-- Ball trajectory arc — curves in from the right and strikes the stumps -->
  <path d="M28 6 Q 18 8, 12 14" stroke="#00D4AA" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="0.5 2.2" opacity="0.7"/>
  <!-- The ball itself — small filled circle at the end of the arc -->
  <circle cx="11.4" cy="14.4" r="1.7" fill="#00D4AA"/>
  <!-- Three stumps — slightly different heights for a hand-drawn, organic feel -->
  <rect x="9" y="13" width="1.6" height="12" rx="0.8" fill="#00D4AA"/>
  <rect x="13" y="11" width="1.6" height="14" rx="0.8" fill="#00D4AA"/>
  <rect x="17" y="12" width="1.6" height="13" rx="0.8" fill="#00D4AA"/>
  <!-- Bails — offset/jittered to suggest a wicket just disturbed -->
  <rect x="8.6" y="10.4" width="3.2" height="1.2" rx="0.6" fill="#00D4AA" transform="rotate(-3 8.6 10.4)"/>
  <rect x="13.4" y="9.8" width="3.2" height="1.2" rx="0.6" fill="#00D4AA" transform="rotate(-6 13.4 9.8)"/>
</svg>
